name: Generate Isometric Contributions

on:
  schedule:
    # Ejecutar todos los días a las 00:00 UTC
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Isometric Contribution Calendar
        uses: lowlighter/metrics@latest
        with:
          filename: output/contributions.svg

          token: ${{ secrets.GITHUB_TOKEN }}

          user: arcanus47

          base: ""

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          config_timezone: America/Santo_Domingo

          output_action: commit
